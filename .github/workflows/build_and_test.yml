name: Build and test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: [esp32doit-devkit-v1, native]

    steps:
      - uses: actions/checkout@v1
      - name: Init PlatformIO
        uses: ./.github/actions/setup-platformio
      - name: Build
        run: pio run -e ${{ matrix.platform }}

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: Init PlatformIO
        uses: ./.github/actions/setup-platformio    
      - name: Run tests on the native platform
        run: platformio test -e native